name: Usage question
description: Ask a question about using ADP-OS / 关于使用 ADP-OS 的问题
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What are you trying to accomplish with ADP-OS?
    validations:
      required: true

  - type: textarea
    id: runtime
    attributes:
      label: Runtime Configuration
      description: Which runtimes (frontend/backend/agent) are you using? What's your setup?
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands Tried
      description: What commands have you run? Paste the output of `adp doctor` and `adp status`.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Topic Area
      description: Which area of ADP-OS is your question about?
      options:
        - workspace-planning
        - release-readiness
        - installation-and-setup
        - runtime-management
        - sync-and-networking
        - mcp-and-agent-sdk
        - other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety Checklist
      description: Confirm the following are NOT included in this question.
      options:
        - label: No secrets, private keys, tokens, or credentials are included
          required: true
        - label: No VM disks, ISO files, or private local paths are shared
          required: true
    validations:
      required: true
