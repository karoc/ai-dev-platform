name: Feature request
description: Suggest an idea or enhancement / 建议新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: A clear description of the problem or gap. What made you want this feature?
      placeholder: "I want to use ADP-OS with a Docker-based CI pipeline but..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like ADP-OS to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried workarounds or alternative approaches?

  - type: dropdown
    id: workflow
    attributes:
      label: Workflow Type
      description: Which ADP-OS workflow does this feature impact?
      options:
        - agent-native-workflow
        - docker-or-devcontainer
        - workspace-orchestration
        - documentation-and-docs
        - ci-and-validation
        - other
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety Checklist
      description: Confirm the following are NOT included in this request.
      options:
        - label: No secrets, private keys, tokens, or credentials are included
          required: true
        - label: No VM disks, ISO files, or private local paths are shared
          required: true
    validations:
      required: true
