name: Bug report
description: Report a bug or unexpected behavior / 报告错误或异常行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I run `adp up agent`, ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to trigger the bug.
      placeholder: |
        1. Run `adp up agent`
        2. Wait for autoinstall
        3. Run `adp status agent`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, logs, or screenshots.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Run diagnostic commands and paste the output.
      value: |
        ```powershell
        # Run repository validation
        .\tests\validate.ps1 -Quick

        # System info
        $PSVersionTable.PSVersion
        vmrun.exe list
        wsl --version

        # ADP-OS diagnostics
        adp doctor
        adp status
        ```
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety Checklist
      description: Confirm the following are NOT included in this report.
      options:
        - label: No secrets, private keys, tokens, or credentials are included
          required: true
        - label: No VM disks, ISO files, or private local paths are attached
          required: true
    validations:
      required: true
