name: Bug report
description: Report a reproducible ADP-OS problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a reproducible problem. For usage questions, use the Usage question template instead. For vulnerabilities, follow SECURITY.md and do not publish exploit details. Do not include secrets, private keys, tokens, VM disks, ISO files, large logs, or private local paths that should not be public. See SUPPORT.md for diagnostics and scope boundaries.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - install
        - cli
        - vmware
        - networking
        - bootstrap
        - sync
        - browser-testing
        - workspace
        - validation
        - documentation
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ADP-OS version
      description: Output of `adp version` or the git tag/commit.
      placeholder: v0.2.0 or b068842
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Windows Server 2025
        - Windows Server 2022
        - other
    validations:
      required: true
  - type: input
    id: wsl_version
    attributes:
      label: WSL version
      description: Output of `wsl --version` (first line).
      placeholder: "WSL version: 2.4.11.0"
    validations:
      required: true
  - type: input
    id: vmware_version
    attributes:
      label: VMware version
      description: VMware Workstation edition and version number.
      placeholder: VMware Workstation Pro 17.6.2
    validations:
      required: true
  - type: input
    id: powershell_version
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion`.
      placeholder: 7.5.0
  - type: input
    id: local_config
    attributes:
      label: Local config sections
      description: If `configs\local.json` exists, list only the supported top-level sections present. Do not paste private paths or secrets.
      placeholder: platform, topology
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest command sequence that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant output from non-sensitive diagnostics.
      render: text
      placeholder: |
        .\cli\adp.ps1 doctor
        .\cli\adp.ps1 status
        .\cli\adp.ps1 sync status
        .\tests\validate.ps1 -Quick
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private keys, tokens, VM disks, ISO files, large logs, and private local paths from this report.
          required: true
